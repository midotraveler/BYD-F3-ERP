<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FleetPro ERP / CRM — إدارة أسطول BYD F3 (غاز + بنزين 92)</title>
  <style>
    /* ==================== DESIGN TOKENS & RESET ==================== */
    :root {
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-soft: #64748b;
      --border-light: #e2e8f0;
      --border-strong: #cbd5e1;

      --teal-600: #0d9488;
      --teal-700: #0f766e;
      --teal-800: #115e59;
      --teal-900: #134e4a;
      --teal-50: #f0fdfa;
      --teal-100: #ccfbf1;

      --amber-600: #d97706;
      --amber-700: #b45309;
      --amber-50: #fffbeb;
      --amber-100: #fef3c7;

      --red-600: #dc2626;
      --red-700: #b91c1c;
      --red-50: #fef2f2;
      --red-100: #fee2e2;

      --green-600: #16a34a;
      --green-700: #15803d;
      --green-50: #f0fdf4;
      --green-100: #dcfce7;

      --indigo-600: #4f46e5;
      --indigo-50: #eef2ff;
      --indigo-100: #e0e7ff;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 22px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 14px 32px rgba(15, 23, 42, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: "Segoe UI", Tahoma, Arial, system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .hidden {
      display: none !important;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* ==================== TOP HEADER & ICON NAVIGATION ==================== */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, var(--teal-900) 0%, var(--teal-700) 100%);
      color: #ffffff;
      box-shadow: var(--shadow-md);
    }

    .top-bar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .brand-sub {
      font-size: 12px;
      color: #ccfbf1;
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .odo-pill {
      background: rgba(15, 23, 42, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .icon-nav-strip {
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .icon-nav-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 8px;
    }

    .icon-tab {
      appearance: none;
      border: 1.5px solid var(--border-light);
      background: var(--bg-subtle);
      color: var(--text-muted);
      border-radius: var(--radius-md);
      padding: 9px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.18s ease;
      min-height: 62px;
    }

    .icon-tab:hover {
      border-color: var(--teal-600);
      background: var(--teal-50);
      color: var(--teal-800);
    }

    .icon-tab.active {
      background: linear-gradient(135deg, var(--teal-700), var(--teal-600));
      border-color: var(--teal-700);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.28);
    }

    /* ==================== MAIN CONTAINER & CARDS ==================== */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 16px 14px 44px;
    }

    .container-narrow {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 44px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-light);
      flex-wrap: wrap;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      margin: 0;
    }

    .card-subtitle {
      font-size: 12.5px;
      color: var(--text-soft);
      margin-top: 2px;
    }

    /* ==================== KPI & STAT GRIDS ==================== */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 900px) {
      .grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .grid-4, .grid-3, .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 15px;
      box-shadow: var(--shadow-sm);
      border-right: 4px solid var(--teal-600);
    }

    .kpi-card.amber { border-right-color: var(--amber-600); }
    .kpi-card.green { border-right-color: var(--green-600); }
    .kpi-card.red { border-right-color: var(--red-600); }
    .kpi-card.indigo { border-right-color: var(--indigo-600); }

    .kpi-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-soft);
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 21px;
      font-weight: 900;
      color: var(--text-main);
    }

    .kpi-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ==================== FORM CONTROLS (HIGH CONTRAST) ==================== */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 5px;
    }

    .field-hint {
      font-size: 11.5px;
      color: var(--teal-700);
      font-weight: 700;
    }

    .input, .select, .textarea {
      width: 100%;
      background-color: #ffffff;
      color: #0f172a;
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input:focus, .select:focus, .textarea:focus {
      outline: none;
      border-color: var(--teal-600);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.16);
    }

    .input[readonly] {
      background-color: #f1f5f9;
      color: #334155;
    }

    .checklist-box {
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin: 12px 0;
    }

    .checklist-heading {
      font-size: 13px;
      font-weight: 800;
      color: var(--teal-800);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      background: #ffffff;
      border: 1px solid var(--border-light);
      margin-bottom: 7px;
    }

    .check-item:last-child {
      margin-bottom: 0;
    }

    .check-item input[type="checkbox"] {
      width: 19px;
      height: 19px;
      accent-color: var(--teal-700);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ==================== BUTTONS ==================== */
    .btn {
      appearance: none;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 15px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal-700), var(--teal-600));
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(15, 118, 110, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--teal-800), var(--teal-700));
    }

    .btn-dark {
      background: #0f172a;
      color: #ffffff;
    }

    .btn-dark:hover:not(:disabled) {
      background: #1e293b;
    }

    .btn-amber {
      background: var(--amber-600);
      color: #ffffff;
    }

    .btn-amber:hover:not(:disabled) {
      background: var(--amber-700);
    }

    .btn-soft {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid var(--border-strong);
    }

    .btn-soft:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .btn-light-outline {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .btn-light-outline:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.24);
    }

    .btn-danger {
      background: var(--red-50);
      color: var(--red-700);
      border: 1px solid #fecaca;
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--red-100);
    }

    .btn-sm {
      padding: 6px 11px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-block {
      width: 100%;
      padding: 12px 16px;
      font-size: 14.5px;
    }

    /* ==================== PILLS & ALERTS ==================== */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    .pill-green { background: var(--green-100); color: var(--green-700); }
    .pill-amber { background: var(--amber-100); color: var(--amber-700); }
    .pill-red { background: var(--red-100); color: var(--red-700); }
    .pill-teal { background: var(--teal-100); color: var(--teal-800); }
    .pill-indigo { background: var(--indigo-100); color: var(--indigo-600); }

    .banner {
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .banner-teal {
      background: var(--teal-50);
      border: 1px solid #99f6e4;
      color: var(--teal-900);
    }

    .banner-amber {
      background: var(--amber-50);
      border: 1px solid #fde68a;
      color: #78350f;
    }

    .banner-green {
      background: var(--green-50);
      border: 1px solid #bbf7d0;
      color: #14532d;
    }

    /* ==================== PHOTO CAPTURE & PREVIEW ==================== */
    .photo-box {
      background: var(--teal-50);
      border: 2px dashed var(--teal-600);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: center;
      margin: 12px 0;
    }

    .photo-box.done {
      background: var(--green-50);
      border-style: solid;
      border-color: var(--green-600);
    }

    .photo-box-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--teal-900);
      margin-bottom: 4px;
    }

    .photo-box.done .photo-box-title {
      color: var(--green-700);
    }

    .photo-box-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .photo-preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-strong);
      margin-top: 10px;
      background: #0f172a;
    }

    /* ==================== TABLES ==================== */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #ffffff;
    }

    th {
      background: #f8fafc;
      color: var(--text-muted);
      font-weight: 800;
      text-align: right;
      padding: 10px 10px;
      border-bottom: 1.5px solid var(--border-light);
      white-space: nowrap;
    }

    td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #f8fafc;
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 14px;
      background: radial-gradient(circle at top right, #ccfbf1 0%, #f1f5f9 55%, #e2e8f0 100%);
    }

    .login-card {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow-lg);
    }

    .login-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .login-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 10px;
